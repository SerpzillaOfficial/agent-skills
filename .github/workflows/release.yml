name: Release on version bump

# Creates a git tag and a GitHub Release automatically when the version in
# .claude-plugin/plugin.json changes on main. Release notes are taken from the
# matching `### x.y.z (date)` section in VERSIONS.md. Repeated runs never move an
# existing tag — they rebuild and replace only the ZIP archives.
# Can also be started manually (workflow_dispatch) — e.g. to rebuild archives or
# recreate a release after a failure.
# If skills/ or packaging/ changed after the current version tag without a version
# bump, the run fails: those changes must reach users through a release.

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "skills/**"
      - "packaging/**"
      - "VERSIONS.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify that skill changes have been released
        run: |
          VERSION=$(python3 scripts/package_skill.py --version)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            CHANGED=$(git diff --name-only "refs/tags/v$VERSION..HEAD" -- skills/ packaging/)
            if [ -n "$CHANGED" ]; then
              echo "Changes after tag v$VERSION that did not make it into the release:"
              echo "$CHANGED" | sed 's/^/  - /'
              echo "::error::skills/ or packaging/ changed after tag v$VERSION but the version was not bumped — the changes will not reach users of releases. Bump the version in SKILL.md, plugin.json and marketplace.json and describe it in VERSIONS.md."
              exit 1
            fi
          fi

      - name: Determine the version and check whether the tag exists
        id: ver
        run: |
          VERSION=$(python3 scripts/package_skill.py --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "package_ref=$(git rev-parse "refs/tags/v$VERSION^{commit}")" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged — building archives from the tag commit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "package_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Take release notes and title from VERSIONS.md
        run: |
          python3 - "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.package_ref }}" <<'PY'
          import re, subprocess, sys
          v = sys.argv[1]
          text = subprocess.check_output(["git", "show", f"{sys.argv[2]}:VERSIONS.md"], text=True)
          parts = re.split(r"\n### (\d+\.\d+\.\d+) \([^)]*\)\n", text)
          blocks = {}
          for i in range(1, len(parts), 2):
              blocks[parts[i]] = parts[i + 1].split("\n### ")[0].strip()
          body = blocks.get(v, f"Release {v}")
          open("release-notes.md", "w").write(body + "\n")
          # title = first non-empty line of the block without markup, truncated
          first = next((l for l in body.splitlines() if l.strip()), "")
          first = re.sub(r"[*`_]|^- |\[([^\]]+)\]\([^)]+\)", r"\1", first).strip()
          title = f"v{v} — {first}"
          if len(title) > 100:
              title = title[:99].rstrip() + "…"
          open("release-title.txt", "w").write(title)
          print("Title:", title)
          PY

      - name: Build the ZIP archives from the release commit
        run: |
          git checkout --detach "${{ steps.ver.outputs.package_ref }}"
          python3 scripts/package_skill.py --output dist
          VERSION="${{ steps.ver.outputs.version }}"
          {
            echo ""
            echo "## Skill ZIP archives"
            echo ""
            echo "- \`serpzilla-seo-guest-posting-claude-web.zip\` — for upload to claude.ai and Claude Desktop (*Customize → Skills → Upload a skill*): the same content, but with a short description within the claude.ai limit (200 characters)."
            echo "- \`serpzilla-seo-guest-posting.zip\` — the source skill unchanged, for agents that follow the [Agent Skills](https://agentskills.io) standard: Claude Code, Cursor, OpenAI Codex, Gemini CLI."
            echo "- Copies with the version in the name (\`serpzilla-seo-guest-posting-$VERSION.zip\`) — when a specific version is needed; copies without the version are permanent \`releases/latest/download/...\` links."
            echo ""
            echo "Installing an archive does not connect the Serpzilla MCP server or configure credentials — see the README."
          } >> release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release (if needed) and upload ZIP archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --target "${{ steps.ver.outputs.package_ref }}" \
              --title "$(cat release-title.txt)" \
              --notes-file release-notes.md
          fi
          gh release upload "v$VERSION" dist/*.zip --clobber
          echo "Uploaded skill ZIP archives for v$VERSION"
